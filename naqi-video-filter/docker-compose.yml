# Dev orchestration (SPEC §6.1). Prod moves GPU workers to a separate node pool
# on Kubernetes/ECS. This brings up the stateful pieces + the API for local work.
services:
  api:
    build: { context: ., dockerfile: docker/Dockerfile.api }
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://naqi:naqi@postgres:5432/naqi
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    volumes: ["./:/app"]
    depends_on: [postgres, redis, minio]

  # GPU analysis workers (SPEC §7). Requires an NVIDIA runtime; commented out
  # so `docker compose up` works on CPU-only dev machines.
  # analysis-worker:
  #   build: { context: ., dockerfile: docker/Dockerfile.worker }
  #   command: celery -A workers.app worker -Q gpu -c 1
  #   deploy: { resources: { reservations: { devices: [{ capabilities: [gpu] }] } } }
  #   depends_on: [redis, postgres, minio]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: naqi
      POSTGRES_PASSWORD: naqi
      POSTGRES_DB: naqi
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: naqi
      MINIO_ROOT_PASSWORD: naqi-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
