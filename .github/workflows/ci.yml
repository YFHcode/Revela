name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Enforce LLM-layer network containment (PLAN.md §3.3, D3/D4)
        run: |
          # INTERNET may be declared ONLY by the :insights module (the LLM layer).
          if ! grep -q "android.permission.INTERNET" insights/src/main/AndroidManifest.xml; then
            echo ":insights manifest must be the sole INTERNET declaration"; exit 1
          fi
          offenders=$(grep -rl "android.permission.INTERNET" \
            app/src capture/src core pipeline/src analysis/src 2>/dev/null || true)
          if [ -n "$offenders" ]; then
            echo "INTERNET declared outside :insights:"; echo "$offenders"; exit 1
          fi
          # api.openai.com must be the only remote host referenced in code.
          hosts=$(grep -rhoE 'https://[a-zA-Z0-9.-]+' --include='*.kt' . 2>/dev/null \
            | sort -u | grep -v '^https://api.openai.com$' || true)
          if [ -n "$hosts" ]; then
            echo "Unexpected remote hosts in source:"; echo "$hosts"; exit 1
          fi
          echo "OK: network access contained to :insights → api.openai.com."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
