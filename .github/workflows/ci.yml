name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Enforce no INTERNET permission (PLAN.md §6, D3)
        run: |
          manifest=$(find app/build -path "*merged*" -name AndroidManifest.xml | head -n1)
          if [ -z "$manifest" ]; then
            echo "Merged manifest not found"; exit 1
          fi
          if grep -q "android.permission.INTERNET" "$manifest"; then
            echo "INTERNET permission found in merged manifest — forbidden until the M5 LLM layer adds it deliberately."
            exit 1
          fi
          echo "OK: no INTERNET permission in merged manifest."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
